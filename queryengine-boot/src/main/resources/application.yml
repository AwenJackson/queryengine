server:
  port: 8080

spring:
  application:
    name: queryengine-boot
  profiles:
    active: mysql
  datasource:
    url: jdbc:h2:mem:queryengine;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql

queryengine:
  dialect: mysql
  schema: demo
  default-page-size: 10
  max-page-size: 100
  access:
    enabled: true
    table: access
